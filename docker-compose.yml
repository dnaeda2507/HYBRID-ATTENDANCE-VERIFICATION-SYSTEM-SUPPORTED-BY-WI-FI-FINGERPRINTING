version: "3.9"

services:

  # ── SQL Server ──────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root                          # run as root so it can chown the data dir
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_AGENT_ENABLED: "false"
    volumes:
      - sqlserver_data:/var/opt/mssql
    # Fix ownership then drop to mssql (UID 10001) before starting sqlservr
    entrypoint:
      - /bin/bash
      - -c
      - |
        chown -R 10001:0 /var/opt/mssql
        exec su mssql -s /bin/bash -c "/opt/mssql/bin/sqlservr"
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd
        -S localhost -U sa -P "$$SA_PASSWORD"
        -Q "SELECT 1" -No
      interval: 15s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── ASP.NET Core Backend ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "9001:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;Database=${DB_NAME:-CSEProject};
        User=sa;Password=${DB_PASSWORD};TrustServerCertificate=True
      JWTSettings__Key: ${JWT_KEY}
      JWTSettings__Issuer: ${JWT_ISSUER:-AttendanceSystem}
      JWTSettings__Audience: ${JWT_AUDIENCE:-AttendanceSystemUsers}
      JWTSettings__DurationInMinutes: ${JWT_DURATION:-3600}
      FastAPI__BaseUrl: http://ml-service:8000
      FastAPI__InternalToken: ${INTERNAL_TOKEN}
      MailSettings__EmailFrom: ${MAIL_FROM}
      MailSettings__SmtpHost: ${SMTP_HOST}
      MailSettings__SmtpPort: ${SMTP_PORT:-587}
      MailSettings__SmtpUser: ${SMTP_USER}
      MailSettings__SmtpPass: ${SMTP_PASS}
      MailSettings__DisplayName: ${MAIL_DISPLAY_NAME:-Attendance System}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Python FastAPI ML Service ───────────────────────────────
  ml-service:
    build:
      context: ./wifi_attendance
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: >-
        mssql+pymssql://sa:${DB_PASSWORD}@sqlserver:1433/${DB_NAME:-CSEProject}
      SECRET_KEY: ${JWT_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      CS_BACKEND_URL: http://backend:80
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Next.js Web Frontend ────────────────────────────────────
  frontend:
    build:
      context: ./frontend/atsysweb
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_API_VERSION: ${NEXT_PUBLIC_API_VERSION:-1.0}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sqlserver_data:
